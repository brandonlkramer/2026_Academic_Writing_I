<script>const DECK = {"week": 3, "slides": ["<p>Unit 4 · Week 3<\/p>\n<h1>Writing from a Source<\/h1>\n<h2>What Makes a Good Teacher? — Summary &amp; Paraphrase<\/h2>", "<h2>Today's plan<\/h2>\n<ol>\n<li><strong>Timed writing<\/strong> — Group 3 · 10 minutes<\/li>\n<li><strong>Review descriptive paragraphs<\/strong> — quick review<\/li>\n<li><strong>A new skill<\/strong> — summary &amp; paraphrase<\/li>\n<li><strong>Write from the source<\/strong> — what makes a good teacher?<\/li>\n<\/ol>", "<h2>Timed writing — Group 3<\/h2>\n<p>Choose <strong>one topic from Group 3<\/strong> on your topic list.<\/p>\n<p><strong>2 minutes<\/strong> for planning — you can use your dictionary<\/p>\n<p><button class=\"timer\" data-min=\"2\">⏱ Plan · 2 min<\/button><\/p>\n<p><strong>8 minutes<\/strong> for writing — don't stop until it's finished!<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Write · 8 min<\/button><\/p>", "<h2>A new kind of writing<\/h2>\n<p><strong>Until now<\/strong> — you wrote from your head. Yourself. A classroom you remember.<\/p>\n<p><strong>From now on<\/strong> — you write from a source. A text someone gives you.<\/p>\n<blockquote>\n<p>Your job (for now): say what the source says. Add nothing.<\/p>\n<\/blockquote>", "<h2>Same shape, new job<\/h2>\n<p><strong>The shape stays the same<\/strong><\/p>\n<ol>\n<li>Interesting beginning sentence<\/li>\n<li>Topic sentence<\/li>\n<li>Supporting sentences (3–6)<\/li>\n<li>Concluding sentence<\/li>\n<li>Final sentence<\/li>\n<\/ol>\n<p><strong>The job changes<\/strong> — not \"describe it vividly.\" Say what the text says, shorter, and in your own words. No five senses this week.<\/p>", "<h2>Two words to know<\/h2>\n<p><strong>SUMMARY<\/strong> — Keep the main ideas. Cut the rest. Your paragraph is shorter than the source.<\/p>\n<p><strong>PARAPHRASE<\/strong> — Say it in your own words. Not the source's words.<\/p>", "<h2>Warning: we do not want \"patchwriting\"<\/h2>\n<p><strong>Source:<\/strong> \"Researchers have studied this question for many years.\"<\/p>\n<p>✕ <strong>Patchwriting:<\/strong> \"Scientists have looked at this problem for a long time.\" — same sentence, words swapped<\/p>\n<p>✓ <strong>Real paraphrase:<\/strong> \"The question of what makes a good teacher is not new — it has a long research history.\" — rebuilt from the idea<\/p>\n<blockquote>\n<p>Keep the sentence and change the words = copying.<\/p>\n<\/blockquote>", "<h2>How to do it: four steps<\/h2>\n<ol>\n<li><strong>Read<\/strong> — twice. Do not write yet.<\/li>\n<li><strong>Keyword notes<\/strong> — 1–4 words per line. No sentences. <em>(The key step)<\/em><\/li>\n<li><strong>Hide the source<\/strong> — turn it over. Look only at your notes.<\/li>\n<li><strong>Write, then check<\/strong> — build sentences from your notes.<\/li>\n<\/ol>", "<h2>One helpful hint: take notes in Japanese<\/h2>\n<p>If your notes are in Japanese, you cannot copy the English.<\/p>\n<p><strong>You must build every English sentence yourself.<\/strong><\/p>", "<h2>The source: What makes a good teacher?<\/h2>\n<p>On your handout. Three qualities:<\/p>\n<ol>\n<li><strong>Clear teaching<\/strong> — explains simply · checks understanding<\/li>\n<li><strong>Good relationships<\/strong> — knows students · patient · builds trust<\/li>\n<li><strong>High expectations<\/strong> — believes everyone can succeed · gives feedback<\/li>\n<\/ol>\n<blockquote>\n<p>✕ The first and last paragraphs are NOT main ideas — cut them.<\/p>\n<\/blockquote>", "<h2>Your task<\/h2>\n<p>Write <strong>one paragraph<\/strong>: what makes a good teacher.<\/p>\n<p>About <strong>100 words<\/strong> (shorter than the source) · Unit 4 shape: title, topic sentence, supporting, concluding<\/p>\n<table>\n<thead>\n<tr>\n<th>Read<\/th>\n<th>Notes<\/th>\n<th>Hide &amp; write<\/th>\n<th>Check<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5 min<\/td>\n<td>6 min<\/td>\n<td>16 min<\/td>\n<td>4 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Take your keyword notes in English or Japanese.<\/p>", "<h2>Time to write<\/h2>\n<p><button class=\"timer\" data-min=\"15\">⏱ Write · 15 min<\/button><\/p>\n<p><button class=\"timer\" data-min=\"6\">⏱ Share with a partner · 6 min<\/button><\/p>", "<h2>The five rules<\/h2>\n<ol>\n<li><strong>Add nothing<\/strong> — everything must be in the source.<\/li>\n<li><strong>Make it shorter<\/strong> — cut what is not a main idea.<\/li>\n<li><strong>Your own words<\/strong> — do not copy long phrases.<\/li>\n<li><strong>Keep it true<\/strong> — do not change the meaning.<\/li>\n<li><strong>Unit 4 shape<\/strong> — title, topic, support, conclusion.<\/li>\n<\/ol>", "<h2>Before you finish — check<\/h2>\n<p>Turn the source back over. Ask:<\/p>\n<ul>\n<li>✓ Is everything <strong>true<\/strong> to the source?<\/li>\n<li>✓ Did I copy any <strong>long phrases<\/strong>?<\/li>\n<li>✓ Did I cut the <strong>opening and closing<\/strong>?<\/li>\n<\/ul>", "<h2>Homework<\/h2>\n<ul>\n<li>Read the introduction to Unit 5, compare and contrast paragraphs (p. 38)<\/li>\n<li>Unit 5 Practice Exercises 1, 2 &amp; 3 (pp. 40 and 48) → scan and submit to <strong>LUNA<\/strong><\/li>\n<li>Dictation: compare and contrast paragraph — check on p. 39<\/li>\n<\/ul>"]};</script>
