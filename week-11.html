<script>const DECK = {"week": 11, "slides": ["<p>Week 11<\/p>\n<h1>Feedback Session<\/h1>\n<h2>and Preparing for the Final<\/h2>", "<h2>Today's plan<\/h2>\n<ol>\n<li><strong>Speed writing<\/strong> — Group 1<\/li>\n<li><strong>Feedback<\/strong> — three persuasive paragraphs<\/li>\n<li><strong>Revise<\/strong> your own paragraph<\/li>\n<li><strong>Preparing for the final<\/strong><\/li>\n<\/ol>", "<h2>Speed writing — Group 1<\/h2>\n<p>Choose <strong>one topic from Group 1<\/strong> on your topic list.<\/p>\n<p><strong>2 minutes<\/strong> for planning — you can use your dictionary<\/p>\n<p><button class=\"timer\" data-min=\"2\">⏱ Plan · 2 min<\/button><\/p>\n<p><strong>8 minutes<\/strong> for writing — don't stop until it's finished!<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Write · 8 min<\/button><\/p>\n<p>Then count your words and add them to your Writing Progress graph.<\/p>", "<h2>Three paragraphs<\/h2>\n<p>Read <strong>Samples E, F and G<\/strong>.<\/p>\n<p>Check each one against the moves table.<\/p>\n<p><button class=\"timer\" data-min=\"12\">⏱ Pairs · 12 min<\/button><\/p>", "<h2>What went wrong?<\/h2>\n<p><strong>E<\/strong> — all feeling, no sources<\/p>\n<p><strong>F<\/strong> — \"Research <strong>proves<\/strong>…\", the biggest number as proof, a <strong>straw man<\/strong><\/p>\n<p><strong>G<\/strong> — every move: fair counterargument, concedes, then qualifies<\/p>", "<h2>Fix one sentence<\/h2>\n<p>✕ <em>Research proves that homework causes higher test scores (Cooper, 1989).<\/em><\/p>\n<p>✓ <em>For high school students, homework is <strong><em>_<\/em><\/strong>___ somewhat higher achievement (Cooper, 1989).<\/em><\/p>", "<h2>Revise your own paragraph<\/h2>\n<p>Use the <strong>checklist<\/strong>. Make your changes <strong>by hand<\/strong> on your printed paragraph.<\/p>\n<p>Write your <strong>two biggest changes<\/strong> at the bottom. <strong>Hand it in at the end of class<\/strong> — no typing at home.<\/p>\n<p><button class=\"timer\" data-min=\"22\">⏱ Revise · 22 min<\/button><\/p>", "<h2>The final exam<\/h2>\n<p><strong>Two persuasive paragraphs<\/strong>, in class, on paper<\/p>\n<ol>\n<li><strong>Prepared<\/strong> — <em>Should Japanese schools give less homework?<\/em><\/li>\n<li><strong>New question<\/strong> — about homework, shown on the day, same <strong>evidence pack<\/strong><\/li>\n<\/ol>\n<p>About <strong>80 minutes<\/strong> — you divide the time<\/p>\n<p>Bring: <strong>one A4 page<\/strong> of handwritten notes (one side, key words) — hand it in<\/p>", "<h2>Planning a new prompt in 3 minutes<\/h2>\n<ol>\n<li><strong>Read<\/strong> the evidence first<\/li>\n<li>Choose a position the evidence <strong>can support<\/strong><\/li>\n<li>Pick <strong>two head reasons<\/strong> and the <strong>strongest opposing reason<\/strong><\/li>\n<li>Then write<\/li>\n<\/ol>\n<p><button class=\"timer\" data-min=\"3\">⏱ Plan · 3 min<\/button><\/p>", "<h2>Plan your prepared paragraph<\/h2>\n<p>Fill in the planning table: position, two head reasons, the other side, your response, heart reason, insight — with <strong>sources<\/strong>.<\/p>\n<p><button class=\"timer\" data-min=\"12\">⏱ Plan · 12 min<\/button><\/p>", "<h2>Homework<\/h2>\n<p><strong>Only one thing: study for the final.<\/strong><\/p>\n<ul>\n<li>Study the <strong>evidence pack<\/strong>; make your <strong>one page of notes<\/strong><\/li>\n<li>Finish your <strong>planning table<\/strong> if it isn't done<\/li>\n<li><strong>FlexHours 3<\/strong>: draft due by the exam day (16 Dec)<\/li>\n<\/ul>\n<p>Next week: the final exam.<\/p>"]};</script>
