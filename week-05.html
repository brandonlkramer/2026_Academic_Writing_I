<script>const DECK = {"week": 5, "slides": ["<p>Unit 5 · Week 5<\/p>\n<h1>Compare &amp; Contrast (1)<\/h1>\n<h2>Learning the Patterns<\/h2>", "<h2>Today's plan<\/h2>\n<ol>\n<li><strong>Speed writing<\/strong> — Group 1<\/li>\n<li><strong>Dictation check<\/strong><\/li>\n<li><strong>Three ways to organize a comparison<\/strong><\/li>\n<li><strong>Exercises 1–3<\/strong><\/li>\n<li><strong>Homework<\/strong><\/li>\n<\/ol>", "<h2>Speed writing — Group 1<\/h2>\n<p>Choose <strong>one topic from Group 1<\/strong> on your topic list.<\/p>\n<p><strong>2 minutes<\/strong> for planning — you can use your dictionary<\/p>\n<p><button class=\"timer\" data-min=\"2\">⏱ Plan · 2 min<\/button><\/p>\n<p><strong>8 minutes<\/strong> for writing — don't stop until it's finished!<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Write · 8 min<\/button><\/p>\n<p>Then count your words and add them to your Writing Progress graph.<\/p>", "<h2>Dictation check<\/h2>\n<p>Check your answers from last week's dictation. Ask about anything you missed.<\/p>", "<h2>Three ways to organize a comparison<\/h2>\n<ul>\n<li><strong>Way 1<\/strong> — similarities, then differences<\/li>\n<li><strong>Way 2<\/strong> — one thing, then the other<\/li>\n<li><strong>Way 3<\/strong> — point by point<\/li>\n<\/ul>", "<h2>Way 1 — Similarities, then differences<\/h2>\n<pre><code>Beginning   Interesting Beginning Sentence + Topic Sentence\nMiddle      1. Things that are the SAME about X and Y\n            2. Things that are DIFFERENT about X and Y\nEnd         Concluding Sentence + Interesting Ending Sentence\n<\/code><\/pre>", "<h2>Way 2 — One thing, then the other<\/h2>\n<pre><code>Beginning   Interesting Beginning Sentence + Topic Sentence\nMiddle      1–3. All the points about X\n            4–6. All the points about Y\nEnd         Concluding Sentence + Interesting Ending Sentence\n<\/code><\/pre>", "<h2>Way 3 — Point by point<\/h2>\n<pre><code>Beginning   Interesting Beginning Sentence + Topic Sentence\nMiddle      1. Point 1 — about X and Y\n            2. Point 2 — about X and Y\n            3. Point 3 — about X and Y\nEnd         Concluding Sentence + Interesting Ending Sentence\n<\/code><\/pre>\n<p>Next week you will use <strong>Way 3<\/strong> with real sources.<\/p>", "<h2>Same content, two Ways<\/h2>\n<p>Open your textbook to <strong>Unit 5<\/strong>.<\/p>\n<ul>\n<li>p. 43 — \"A Dog or a Cat?\" in <strong>Way 1<\/strong><\/li>\n<li>p. 44 — the same paragraph in <strong>Way 2<\/strong><\/li>\n<\/ul>\n<p>The organization is a <strong>choice<\/strong>.<\/p>", "<h2>Caution<\/h2>\n<p>Keep your paragraph well organized so the reader is not confused.<\/p>\n<p><strong>Do not change the organization in the middle.<\/strong><\/p>\n<p>Pick one Way and stay with it.<\/p>", "<h2>Linking words — check your homework<\/h2>\n<p>Exercise 3, page 48<\/p>\n<p><em>both · in common · in contrast · on the one hand · on the other hand · similar to · same · too · unlike · while<\/em><\/p>", "<h2>Exercise 1 — Name the Way<\/h2>\n<p>Read Paragraphs A, B and C on your handout.<\/p>\n<p>Write <strong>Way 1, 2 or 3<\/strong> after each one.<\/p>\n<p><button class=\"timer\" data-min=\"7\">⏱ Timer · 7 min<\/button><\/p>", "<h2>Exercise 2 — Organize the points<\/h2>\n<p><strong>Paper books and e-books<\/strong> — the points are given on your handout.<\/p>\n<p>Write one paragraph using <strong>Way 3 (point by point)<\/strong>, about 80–120 words.<\/p>\n<p><button class=\"timer\" data-min=\"12\">⏱ Timer · 12 min<\/button><\/p>", "<h2>Exercise 3 — Group writing<\/h2>\n<p><strong>Studying in the morning vs. studying at night<\/strong><\/p>\n<ol>\n<li>List 2–3 ways they are the <strong>same<\/strong> and 2–3 ways they are <strong>different<\/strong>.<\/li>\n<li>Choose <strong>one Way<\/strong> (Way 1 or Way 3).<\/li>\n<li>Write one paragraph together, about 100–140 words.<\/li>\n<\/ol>\n<p><button class=\"timer\" data-min=\"20\">⏱ Timer · 20 min<\/button><\/p>", "<h2>Homework<\/h2>\n<ul>\n<li>Finish the comparison paragraph (morning vs. night study), using one Way. Type it, submit to <strong>LUNA<\/strong>, and bring a printed copy.<\/li>\n<li>Next <strong>dictation<\/strong>.<\/li>\n<li>Read the rest of <strong>Unit 5<\/strong>.<\/li>\n<\/ul>\n<p>Next week: real sources and citations.<\/p>"]};</script>
