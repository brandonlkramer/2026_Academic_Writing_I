<script>const DECK = {"week": 1, "slides": ["<p>Units 1 &amp; 3 · Week 1<\/p>\n<h1>Academic Writing<\/h1>\n<h2>Class Orientation and Introduction<\/h2>", "<h2>Today's plan<\/h2>\n<ol>\n<li><strong>Speed writing<\/strong> — our weekly start<\/li>\n<li><strong>About this course<\/strong> — LUNA, syllabus, textbook<\/li>\n<li><strong>The POWER process<\/strong> — how we write<\/li>\n<li><strong>Your first paragraph<\/strong> — a self-introduction<\/li>\n<li><strong>Dictation<\/strong> — how and why<\/li>\n<\/ol>", "<h2>Speed writing<\/h2>\n<p>Every week starts with speed writing.<\/p>\n<ol>\n<li>Choose <strong>one topic from Group 1<\/strong> on your topic list.<\/li>\n<li>Plan for <strong>2 minutes<\/strong> — you can use your dictionary.<\/li>\n<li>Write for <strong>8 minutes<\/strong> — don't stop until time is up!<\/li>\n<li>Count your words. Add the number to your <strong>Writing Progress<\/strong> graph.<\/li>\n<\/ol>", "<h2>Speed writing — Group 1<\/h2>\n<p><button class=\"timer\" data-min=\"2\">⏱ Plan · 2 min<\/button><\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Write · 8 min<\/button><\/p>\n<p>Count your words. Rate the topic (1 = hard, 5 = easy). Fill in your graph.<\/p>", "<h2>About this course<\/h2>\n<ul>\n<li><strong>LUNA<\/strong> — homework, files, and the online syllabus<\/li>\n<li><strong>Paper copies<\/strong> — typed papers are printed and brought to class<\/li>\n<li><strong>The textbook<\/strong> — Taylor &amp; Kluge, <em>Academic Writing<\/em><\/li>\n<\/ul>", "<h2>How we write: POWER<\/h2>\n<ol>\n<li><strong>P — Prewriting<\/strong>: find ideas and explore your topic<\/li>\n<li><strong>O — Organizing<\/strong>: put your ideas in order<\/li>\n<li><strong>W — Writing<\/strong>: write your first draft<\/li>\n<li><strong>E — Evaluating<\/strong>: get advice from others on your draft<\/li>\n<li><strong>R — Rewriting<\/strong>: write a better second draft<\/li>\n<\/ol>", "<h2>Your first paragraph: a self-introduction<\/h2>\n<p>Textbook <strong>Unit 3<\/strong><\/p>\n<p>We will use POWER, one step at a time.<\/p>", "<h2>P — Prewriting<\/h2>\n<p>Brainstorm ideas about yourself.<\/p>\n<p><button class=\"timer\" data-min=\"5\">⏱ Brainstorm · 5 min<\/button><\/p>\n<p>Then share your ideas with a partner.<\/p>\n<p><button class=\"timer\" data-min=\"3\">⏱ Share · 3 min<\/button><\/p>", "<h2>O — Organizing<\/h2>\n<p>Keep brainstorming. Choose your best ideas and put them in order.<\/p>\n<p><button class=\"timer\" data-min=\"5\">⏱ Organize · 5 min<\/button><\/p>", "<h2>W — Writing<\/h2>\n<p>Write your self-introduction paragraph.<\/p>\n<p><button class=\"timer\" data-min=\"15\">⏱ Write · 15 min<\/button><\/p>", "<h2>E — Evaluating<\/h2>\n<p>Exchange paragraphs with a partner. Read, then give advice.<\/p>\n<p><button class=\"timer\" data-min=\"6\">⏱ Share &amp; feedback · 6 min<\/button><\/p>\n<p>Then <strong>scan your paragraph<\/strong> and submit it to LUNA.<\/p>", "<h2>R — Rewriting (homework)<\/h2>\n<ol>\n<li>Read pages 19–21.<\/li>\n<li>Edit and revise your paragraph.<\/li>\n<li>Type it in a <strong>Word document<\/strong>.<\/li>\n<li>Format it like the paragraph on page 15 — <strong>black font only<\/strong>.<\/li>\n<li><strong>Print it<\/strong> and bring it to class next week.<\/li>\n<\/ol>\n<p>For formatting papers in APA style, check the instructions on <strong>LUNA<\/strong>.<\/p>", "<h2>Dictation<\/h2>\n<p>Each week you will do a dictation for homework.<\/p>\n<p>Let's practise once together: the reading on <strong>page 15<\/strong>.<\/p>", "<h2>Homework<\/h2>\n<ol>\n<li><strong>Self-introduction paragraph<\/strong> — typed, formatted, <strong>printed<\/strong>, brought to class<\/li>\n<li><strong>Unit 4 dictation<\/strong> — scan and submit to LUNA; check your answer on page 29<\/li>\n<\/ol>\n<p>Finish the textbook readings and exercises if you haven't yet.<\/p>"]};</script>
