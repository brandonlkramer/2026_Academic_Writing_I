<script>const DECK = {"week": 8, "slides": ["<p>Unit 10 · Week 8<\/p>\n<h1>Cause &amp; Effect (2)<\/h1>\n<h2>How Strong Is the Cause?<\/h2>", "<h2>Today's plan<\/h2>\n<ol>\n<li><strong>Speed writing<\/strong> — Group 1<\/li>\n<li><strong>Triage<\/strong> — some posts from the internet<\/li>\n<li><strong>Evaluate<\/strong> — the research evidence<\/li>\n<li><strong>Choose a claim<\/strong> — not too strong, not too weak<\/li>\n<li><strong>Write<\/strong><\/li>\n<\/ol>", "<h2>Speed writing — Group 1<\/h2>\n<p>Choose <strong>one topic from Group 1<\/strong> on your topic list.<\/p>\n<p><strong>2 minutes<\/strong> for planning — you can use your dictionary<\/p>\n<p><button class=\"timer\" data-min=\"2\">⏱ Plan · 2 min<\/button><\/p>\n<p><strong>8 minutes<\/strong> for writing — don't stop until it's finished!<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Write · 8 min<\/button><\/p>\n<p>Then count your words and add them to your Writing Progress graph.<\/p>", "<h2>The question returns<\/h2>\n<p><strong>Does homework cause higher achievement?<\/strong><\/p>\n<p>In Week 7 you wrote your first answer. Today you decide what the evidence <strong>really<\/strong> shows.<\/p>", "<h2>Remember Exercise 3<\/h2>\n<ul>\n<li><strong>B<\/strong> — the cause is <strong>not enough<\/strong><\/li>\n<li><strong>C<\/strong> — cause and effect are <strong>backwards<\/strong><\/li>\n<li><strong>E<\/strong> — the cause is <strong>against<\/strong> the effect<\/li>\n<\/ul>\n<p>And the Caution: <strong>do not confuse chance with cause.<\/strong><\/p>", "<h2>Stage 1: triage the posts<\/h2>\n<p>Can you trust this source <strong>at all<\/strong>?<\/p>\n<p>Name the problem in each post. Then set it aside.<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Pairs · 8 min<\/button><\/p>", "<h2>Stage 2: evaluate the research<\/h2>\n<p>For each piece of evidence, ask:<\/p>\n<ul>\n<li><strong>Backwards?<\/strong> Could the effect be the cause?<\/li>\n<li><strong>A third thing?<\/strong> Could something else explain it?<\/li>\n<li><strong>Enough?<\/strong> Does it prove the cause?<\/li>\n<li><strong>Against?<\/strong> Does it point the other way?<\/li>\n<\/ul>\n<p><button class=\"timer\" data-min=\"18\">⏱ Groups · 18 min<\/button><\/p>", "<h2>The biggest number<\/h2>\n<p>Japan: <strong>one more hour → about 17 more points<\/strong><\/p>\n<p>Is the biggest number the <strong>strongest proof<\/strong>?<\/p>", "<h2>Stage 3: choose your claim<\/h2>\n<pre><code>too strong →  &quot;Homework causes higher achievement.&quot;\n   right   →  &quot;Homework may contribute to higher achievement\n               for older students, but the effect is small\n               and the evidence is mixed.&quot;\ntoo weak  →  &quot;We cannot know anything about homework.&quot;\n<\/code><\/pre>\n<p><em>causes → contributes to → may contribute to → is linked to → the evidence cannot show that…<\/em><\/p>", "<h2>Write<\/h2>\n<p>One paragraph · <strong>150–200 words<\/strong> · Unit 10 form<\/p>\n<ol>\n<li>A claim that <strong>matches<\/strong> the evidence<\/li>\n<li>Three pieces of research, <strong>in your own words<\/strong>, with sources named<\/li>\n<li>Say what one piece does <strong>not<\/strong> prove<\/li>\n<li>One piece <strong>against<\/strong> the easy claim — handled honestly<\/li>\n<li>No weak post used as <strong>proof<\/strong><\/li>\n<\/ol>\n<p><button class=\"timer\" data-min=\"25\">⏱ Write · 25 min<\/button><\/p>", "<h2>Homework<\/h2>\n<ul>\n<li>Finish the paragraph — typed, sources named, on <strong>LUNA<\/strong>, printed copy<\/li>\n<li><strong>Read<\/strong> Texts A and B (Week 9 reading) and fill the table<\/li>\n<li><strong>FlexHours 2<\/strong>: three sources and your <strong>Source Log<\/strong> due before next class<\/li>\n<li><strong>Dictation<\/strong>: Unit 5, p. 45<\/li>\n<li>Read <strong>Unit 11<\/strong>, pp. 112–113<\/li>\n<\/ul>\n<p>Next week: take a side.<\/p>"]};</script>
