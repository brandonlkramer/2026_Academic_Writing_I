<script>const DECK = {"week": 10, "slides": ["<p>Unit 11 · Week 10<\/p>\n<h1>Persuasive Paragraphs (2)<\/h1>\n<h2>Answering the Other Side<\/h2>", "<h2>Today's plan<\/h2>\n<ol>\n<li><strong>Speed writing<\/strong> — Group 3<\/li>\n<li><strong>Why answer the other side?<\/strong><\/li>\n<li><strong>Fair or unfair?<\/strong><\/li>\n<li><strong>Group practice<\/strong><\/li>\n<li><strong>Revise<\/strong> your Week 9 paragraph<\/li>\n<\/ol>", "<h2>Speed writing — Group 3<\/h2>\n<p>Choose <strong>one topic from Group 3<\/strong> on your topic list.<\/p>\n<p><strong>2 minutes<\/strong> for planning — you can use your dictionary<\/p>\n<p><button class=\"timer\" data-min=\"2\">⏱ Plan · 2 min<\/button><\/p>\n<p><strong>8 minutes<\/strong> for writing — don't stop until it's finished!<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Write · 8 min<\/button><\/p>\n<p>Then count your words and add them to your Writing Progress graph.<\/p>", "<h2>Your reader disagrees<\/h2>\n<p>A reader who disagrees is <strong>already thinking of reasons<\/strong>.<\/p>\n<p>If you say their <strong>best<\/strong> reason fairly and <strong>answer<\/strong> it, your paragraph gets <strong>stronger<\/strong>.<\/p>", "<h2>The new part<\/h2>\n<pre><code>Middle      1. Head Reason 1 (cited)\n            2. Head Reason 2 (cited)\n            3. Counterargument (fair, cited)\n               + Your response\n            4. Heart Reason (labelled)\n<\/code><\/pre>", "<h2>Two ways to respond<\/h2>\n<p><strong>Rebut<\/strong> — show the reason is weaker than it looks, with evidence.<\/p>\n<p><strong>Concede and qualify<\/strong> — agree it is partly true, then show its limit.<\/p>\n<p><em>Some people argue that… · It is true that… However, … · This may be true for…, but… · This does not mean that…<\/em><\/p>", "<h2>Fair or unfair?<\/h2>\n<p>✕ <em>Some people think homework is good because teachers like to control students. This is silly.<\/em><\/p>\n<p>✓ <em>Some people argue that homework helps students learn to manage their time and study alone (Ramdass &amp; Zimmerman, 2011). This is a real benefit for older students. However, for elementary school students, homework has almost no measured link to achievement (Cooper, 1989).<\/em><\/p>\n<p>What are <strong>three<\/strong> differences?<\/p>\n<p><button class=\"timer\" data-min=\"4\">⏱ Pairs · 4 min<\/button><\/p>", "<h2>Group practice<\/h2>\n<p>Sit with students who took the <strong>same position<\/strong>.<\/p>\n<ol>\n<li>Choose the <strong>strongest<\/strong> opposing reason — not the easiest.<\/li>\n<li>Write the <strong>counterargument<\/strong> together, cited.<\/li>\n<li>Write a <strong>response<\/strong> together.<\/li>\n<\/ol>\n<p><button class=\"timer\" data-min=\"18\">⏱ Groups · 18 min<\/button><\/p>", "<h2>Revise your Week 9 paragraph<\/h2>\n<p>Add the counterargument and response <strong>after your head reasons<\/strong>.<\/p>\n<ul>\n<li>Is the other side's reason <strong>fair<\/strong> and <strong>cited<\/strong>?<\/li>\n<li>Does your response use <strong>evidence<\/strong>?<\/li>\n<li>Is it <strong>shorter<\/strong> than your own reasons?<\/li>\n<li>Is your heart reason still <strong>labelled<\/strong>?<\/li>\n<\/ul>\n<p><button class=\"timer\" data-min=\"25\">⏱ Revise · 25 min<\/button><\/p>", "<h2>Activity 2 — on your own (optional)<\/h2>\n<p><strong>Should Japanese elementary schools stop giving homework?<\/strong><\/p>\n<p>Same reasons pool — but some reasons fit this question <strong>better<\/strong> than others.<\/p>\n<p>180–220 words · counterargument · reference list<\/p>", "<h2>Homework<\/h2>\n<ul>\n<li><strong>Revised Week 9 paragraph<\/strong> with the other side added — on <strong>LUNA<\/strong>, printed copy<\/li>\n<li><em>Optional:<\/em> <strong>Activity 2<\/strong>, the elementary school question — on <strong>LUNA<\/strong> (good practice for the final)<\/li>\n<li><strong>FlexHours 3<\/strong> opens: your FX2 question and sources, the Week 10 shape<\/li>\n<\/ul>\n<p>Next week: feedback and preparing for the final.<\/p>"]};</script>
