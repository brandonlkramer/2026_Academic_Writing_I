<script>const DECK = {"week": 7, "slides": ["<p>Unit 10 · Week 7<\/p>\n<h1>Cause &amp; Effect (1)<\/h1>\n<h2>The Form, and What Homework Does<\/h2>", "<h2>Today's plan<\/h2>\n<ol>\n<li><strong>Week 6 feedback<\/strong> — citing your sources<\/li>\n<li><strong>Speed writing<\/strong> — Group 3<\/li>\n<li><strong>The cause and effect paragraph<\/strong> (Unit 10)<\/li>\n<li><strong>Exercises 1 and 3<\/strong> — correct and incorrect causes<\/li>\n<li><strong>Meet the evidence<\/strong> — homework and test scores<\/li>\n<li><strong>Write<\/strong> — the effects of homework<\/li>\n<\/ol>", "<h2>Week 6 feedback: find four problems<\/h2>\n<p style=\"font-size:24px; text-align:left; line-height:1.45\"><strong>Learning New Words.<\/strong> There are two ways to learn words. Source 1 says that you should read books and watch videos. It is slow, but you remember the words well. Source 2 says that you should use flashcards and test yourself. This way is fast. The graph shows that words are important. Both ways are good, but I think flashcards are better.<\/p>\n\n<p>With a partner: what are the <strong>four problems<\/strong>?<\/p>", "<h2>Four problems, four fixes<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The <strong>staple<\/strong>: \"Source 1 says… Source 2 says…\"<\/td>\n<td>Point by point: the two sources meet at each point<\/td>\n<\/tr>\n<tr>\n<td><strong>No citations<\/strong><\/td>\n<td>Author's name + year, in the sentence<\/td>\n<\/tr>\n<tr>\n<td>The graph as <strong>decoration<\/strong><\/td>\n<td>Use Figure 1 to support the shared point<\/td>\n<\/tr>\n<tr>\n<td><strong>Opinion<\/strong><\/td>\n<td>Compare only. Your opinion comes in Unit 11<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "<h2>Speed writing — Group 3<\/h2>\n<p>Choose <strong>one topic from Group 3<\/strong> on your topic list.<\/p>\n<p><strong>2 minutes<\/strong> for planning — you can use your dictionary<\/p>\n<p><button class=\"timer\" data-min=\"2\">⏱ Plan · 2 min<\/button><\/p>\n<p><strong>8 minutes<\/strong> for writing — don't stop until it's finished!<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Write · 8 min<\/button><\/p>\n<p>Then count your words and add them to your Writing Progress graph.<\/p>", "<h2>Dictation check<\/h2>\n<p>Check your answers.<\/p>", "<h2>A cause and effect paragraph<\/h2>\n<p>Read the model on <strong>page 101<\/strong>.<\/p>\n<ul>\n<li>What are the <strong>causes<\/strong>?<\/li>\n<li>What are the <strong>effects<\/strong>?<\/li>\n<\/ul>", "<h2>The shape (page 106)<\/h2>\n<pre><code>Beginning   Interesting Beginning Sentence\n            Topic Sentence\nMiddle      1. Cause and Effect 1\n            2. Cause and Effect 2  (optional)\n            3. Cause and Effect 3  (optional)\nEnd         Concluding Sentence\n            Interesting Ending Sentence\n<\/code><\/pre>", "<h2>Words for cause and effect<\/h2>\n<p><em>as a result · because · causes · leads to · results in · due to · therefore · consequently · is linked to<\/em><\/p>\n<p>pages 107–108<\/p>", "<h2>Caution<\/h2>\n<p>Be factual and complete.<\/p>\n<p>Do not confuse fact with opinion.<\/p>\n<p><strong>Do not confuse chance with cause.<\/strong><\/p>", "<h2>Exercise 1 (page 102)<\/h2>\n<p>Is the cause and effect <strong>correct<\/strong> ✓ or <strong>incorrect<\/strong> ✗?<\/p>\n<p>Work with a partner.<\/p>\n<p><button class=\"timer\" data-min=\"5\">⏱ Pairs · 5 min<\/button><\/p>", "<h2>Exercise 3 (page 110): five problems<\/h2>\n<ul>\n<li><strong>A<\/strong> — the cause is not related to the effect<\/li>\n<li><strong>B<\/strong> — the cause is <strong>not enough<\/strong><\/li>\n<li><strong>C<\/strong> — cause and effect are <strong>backwards<\/strong><\/li>\n<li><strong>D<\/strong> — circular: the cause and the effect are the same<\/li>\n<li><strong>E<\/strong> — the cause is <strong>against<\/strong> the effect<\/li>\n<\/ul>", "<h2>Exercise 3 — label each sentence<\/h2>\n<p>Write <strong>A, B, C, D or E<\/strong>.<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Label · 8 min<\/button><\/p>", "<h2>Meet the evidence<\/h2>\n<p>Worksheet <strong>Part 2<\/strong>: two tables about homework and test scores.<\/p>\n<p><button class=\"timer\" data-min=\"6\">⏱ Read &amp; answer · 6 min<\/button><\/p>", "<h2>What do the tables show?<\/h2>\n<ol>\n<li>Most homework — highest score?<\/li>\n<li>A lot of homework — score <strong>below<\/strong> average?<\/li>\n<li>What does the Note say about Korea?<\/li>\n<li>Does Table 1 <strong>prove<\/strong> that homework <strong>causes<\/strong> higher scores?<\/li>\n<\/ol>\n<p><strong>We come back to question 4 in Week 8.<\/strong><\/p>", "<h2>Write: what does homework do?<\/h2>\n<ol>\n<li>Read <strong>\"What Homework Does\"<\/strong> (Part 3).<\/li>\n<li>Fill in the effects chart — <strong>from the source<\/strong>.<\/li>\n<li>Write <strong>120–160 words<\/strong> in the Unit 10 shape.<\/li>\n<\/ol>\n<p><button class=\"timer\" data-min=\"20\">⏱ Write · 20 min<\/button><\/p>", "<h2>Check your paragraph<\/h2>\n<ul>\n<li>✓ Every effect is <strong>from the source<\/strong>, and <strong>cited<\/strong><\/li>\n<li>✓ <strong>One effect<\/strong> in each part<\/li>\n<li>✓ At least <strong>three<\/strong> cause and effect words<\/li>\n<li>✓ \"is <strong>linked to<\/strong>\" — not \"causes\" — for test scores<\/li>\n<li>✓ <strong>No opinion<\/strong> yet<\/li>\n<\/ul>", "<h2>Homework<\/h2>\n<ul>\n<li>Finish the <strong>effects paragraph<\/strong> — typed, cited, reference list, on <strong>LUNA<\/strong>, printed copy<\/li>\n<li><strong>Dictation<\/strong>: Unit 10, p. 101<\/li>\n<li>Review <strong>Exercise 3<\/strong> — you will need A–E in Week 8<\/li>\n<li><strong>FlexHours 2<\/strong> starts now (next slide)<\/li>\n<\/ul>\n<p>Next week: what does the evidence really show?<\/p>", "<h2>FlexHours 2: find and summarize three sources<\/h2>\n<ol>\n<li>Choose <strong>one question<\/strong> from the list on the Source Log<\/li>\n<li>Find <strong>three sources<\/strong> (one research or official) and fill the <strong>Source Log<\/strong> — <strong>before Week 9<\/strong><\/li>\n<li><strong>Summaries<\/strong> (60–100 words each, cited), one <strong>Summary Sheet<\/strong> per source — <strong>before Week 10<\/strong><\/li>\n<\/ol>\n<p>Japanese sources are OK: summary <strong>in English<\/strong>, title in rōmaji [English meaning]<\/p>\n<p>AI can help you search, but it is <strong>not a source<\/strong>. Open every source yourself.<\/p>\n<p>About 3 hours in total. You will use the same question in FlexHours 3.<\/p>"]};</script>
