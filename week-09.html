<script>const DECK = {"week": 9, "slides": ["<p>Unit 11 · Week 9<\/p>\n<h1>Persuasive Paragraphs (1)<\/h1>\n<h2>Take a Position<\/h2>", "<h2>Today's plan<\/h2>\n<ol>\n<li><strong>Speed writing<\/strong> — Group 2<\/li>\n<li><strong>The persuasive paragraph<\/strong> (Unit 11)<\/li>\n<li><strong>Head or heart?<\/strong><\/li>\n<li><strong>The reasons pool<\/strong><\/li>\n<li><strong>Write<\/strong> — take a side<\/li>\n<\/ol>", "<h2>Speed writing — Group 2<\/h2>\n<p>Choose <strong>one topic from Group 2<\/strong> on your topic list.<\/p>\n<p><strong>2 minutes<\/strong> for planning — you can use your dictionary<\/p>\n<p><button class=\"timer\" data-min=\"2\">⏱ Plan · 2 min<\/button><\/p>\n<p><strong>8 minutes<\/strong> for writing — don't stop until it's finished!<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Write · 8 min<\/button><\/p>\n<p>Then count your words and add them to your Writing Progress graph.<\/p>", "<h2>A persuasive paragraph<\/h2>\n<p>Read the model on <strong>page 113<\/strong>.<\/p>\n<ul>\n<li>Which reasons are about <strong>facts<\/strong>?<\/li>\n<li>Which reasons are about <strong>feelings<\/strong>?<\/li>\n<\/ul>", "<h2>The shape (page 117)<\/h2>\n<pre><code>Beginning   Interesting Beginning Sentence\n            Topic Sentence  ← your position\nMiddle      1. Head Reason 1\n            2. Head Reason 2\n            3. Heart Reason\nEnd         Concluding Sentence (an insight)\n            Interesting Ending Sentence\n<\/code><\/pre>", "<h2>What is missing from the model?<\/h2>\n<ul>\n<li>Where do the reasons <strong>come from<\/strong>?<\/li>\n<li>Are there any <strong>citations<\/strong>?<\/li>\n<li>What about <strong>the other side<\/strong>?<\/li>\n<\/ul>\n<p>This week: sources and citations. <strong>Next week: the other side.<\/strong><\/p>", "<h2>Head or heart? (page 114)<\/h2>\n<ul>\n<li><strong>Head reason<\/strong> — facts or evidence. You can <strong>check<\/strong> it and <strong>cite<\/strong> it.<\/li>\n<li><strong>Heart reason<\/strong> — feelings. It can move people, but it is <strong>not proof<\/strong>.<\/li>\n<\/ul>\n<p><button class=\"timer\" data-min=\"5\">⏱ Exercise 1 · 5 min<\/button><\/p>", "<h2>The rule in this course<\/h2>\n<p>Head reasons come <strong>from sources<\/strong>, and you <strong>cite<\/strong> them.<\/p>\n<p>You may use <strong>one<\/strong> heart reason — but you must <strong>label it as a feeling<\/strong>.<\/p>\n<blockquote>\n<p><em>\"Beyond what the research shows…\"<\/em> · <em>\"On a human level…\"<\/em><\/p>\n<\/blockquote>", "<h2>The question<\/h2>\n<p><strong>Should Japanese schools give less homework?<\/strong><\/p>\n<p>Read the <strong>reasons pool<\/strong> and the <strong>local source<\/strong>.<\/p>\n<p>Mark each reason: <strong>less<\/strong> or <strong>keep<\/strong>? Underline the source.<\/p>\n<p><button class=\"timer\" data-min=\"10\">⏱ Read · 10 min<\/button><\/p>", "<h2>One source, two sides<\/h2>\n<p><strong>Cooper (1989)<\/strong> is on <strong>both<\/strong> lists.<\/p>\n<p>How can the same research support <strong>less<\/strong> homework <em>and<\/em> <strong>keeping<\/strong> homework?<\/p>\n<blockquote>\n<p>Hint: which students is each side talking about?<\/p>\n<\/blockquote>", "<h2>Choose and plan<\/h2>\n<ol>\n<li>Your <strong>position<\/strong>: less, or keep?<\/li>\n<li><strong>Two head reasons<\/strong> — with their sources<\/li>\n<li><strong>One heart reason<\/strong> — labelled as a feeling<\/li>\n<li>Your <strong>order<\/strong>: most → least important, or least → most<\/li>\n<\/ol>\n<p><button class=\"timer\" data-min=\"8\">⏱ Plan · 8 min<\/button><\/p>", "<h2>Write<\/h2>\n<p>One paragraph · <strong>160–200 words<\/strong> · Unit 11 shape<\/p>\n<ul>\n<li>A clear <strong>position<\/strong><\/li>\n<li>Two head reasons, <strong>cited<\/strong>, with careful words: <em>is linked to<\/em>, not <em>proves<\/em><\/li>\n<li>One heart reason, <strong>labelled<\/strong><\/li>\n<li>End with an <strong>insight<\/strong><\/li>\n<li><strong>Reference list<\/strong><\/li>\n<\/ul>\n<p><button class=\"timer\" data-min=\"25\">⏱ Write · 25 min<\/button><\/p>", "<h2>Homework<\/h2>\n<ul>\n<li>Finish the paragraph — hand-written, cited, reference list, on <strong>LUNA<\/strong><\/li>\n<li><strong>Keep it<\/strong> — you will add to it next week<\/li>\n<li><strong>FlexHours 2<\/strong> summaries due before next class<\/li>\n<li>Read <strong>Unit 11<\/strong>, pp. 118–120<\/li>\n<\/ul>\n<p>Next week: answer the other side.<\/p>"]};</script>
