<script>const DECK = {"week": 6, "slides": ["<p>Unit 5 · Week 6<\/p>\n<h1>Compare &amp; Contrast (2)<\/h1>\n<h2>Sources, a Graph, and Citations<\/h2>", "<h2>Today's plan<\/h2>\n<ol>\n<li><strong>Speed writing<\/strong> — Group 2<\/li>\n<li><strong>Week 4 on-demand check<\/strong><\/li>\n<li><strong>How to cite a source<\/strong><\/li>\n<li><strong>Read three sources<\/strong> — two texts and a graph<\/li>\n<li><strong>Write with citations<\/strong><\/li>\n<\/ol>", "<h2>Speed writing — Group 2<\/h2>\n<p>Choose <strong>one topic from Group 2<\/strong> on your topic list.<\/p>\n<p><strong>2 minutes<\/strong> for planning — you can use your dictionary<\/p>\n<p><button class=\"timer\" data-min=\"2\">⏱ Plan · 2 min<\/button><\/p>\n<p><strong>8 minutes<\/strong> for writing — don't stop until it's finished!<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Write · 8 min<\/button><\/p>\n<p>Then count your words and add them to your Writing Progress graph.<\/p>", "<h2>Week 4 on-demand assignment<\/h2>\n<p>Have you submitted <strong>both<\/strong> pages to LUNA?<\/p>\n<ul>\n<li><strong>Practice B<\/strong> paragraph<\/li>\n<li><strong>Dictation<\/strong>, with red-pen corrections<\/li>\n<\/ul>\n<p>Ask about anything you were unsure of.<\/p>", "<h2>A citation is a promise (APA style)<\/h2>\n<p>When you use an idea from a source, you show <strong>where it came from<\/strong>.<\/p>\n<blockquote>\n<p>A citation says: <em>this source is real, and you can go and check it.<\/em><\/p>\n<\/blockquote>", "<h2>1. In the sentence<\/h2>\n<p>Author's family name + year<\/p>\n<ul>\n<li>According to <strong>Nation (2013)<\/strong>, you learn words by meeting them many times.<\/li>\n<li>You learn words by meeting them many times <strong>(Nation, 2013)<\/strong>.<\/li>\n<\/ul>\n<p><strong>Reporting verbs:<\/strong> <em>describes · explains · found · suggests · according to<\/em><\/p>", "<h2>2. At the end: the reference list<\/h2>\n<p>Full details of every source you used.<\/p>\n<p>Nation, I. S. P. (2013). <em>Learning Vocabulary in Another Language<\/em> (2nd ed.). Cambridge University Press.<\/p>", "<h2>3. Citing a figure<\/h2>\n<p>Name the figure <strong>and<\/strong> its source.<\/p>\n<ul>\n<li><strong>Figure 1<\/strong> shows that a word is remembered better the more often it is met <strong>(Webb, 2007)<\/strong>.<\/li>\n<\/ul>\n<p>If the figure is <strong>yours<\/strong>, you do not need a citation — but you still mention it.<\/p>", "<h2>4. More than one author<\/h2>\n<p><strong>Two authors:<\/strong> both names — <em>and<\/em> in the sentence, <em>&amp;<\/em> in brackets<\/p>\n<ul>\n<li><strong>Fiorella and Mayer (2013)<\/strong> explain… / … <strong>(Fiorella &amp; Mayer, 2013)<\/strong><\/li>\n<\/ul>\n<p><strong>Three or more:<\/strong> first name + <em>et al.<\/em><\/p>\n<ul>\n<li><strong>Ericsson et al. (1993)<\/strong> found… / … <strong>(Ericsson et al., 1993)<\/strong><\/li>\n<\/ul>\n<p>Reference list: <strong>every<\/strong> author, family name first, <strong>A–Z<\/strong>.<\/p>", "<h2>5. Two sources for one idea<\/h2>\n<p>Both in the same brackets, <strong>A–Z<\/strong>, with a <strong>semicolon<\/strong>.<\/p>\n<ul>\n<li>Words are learned by meeting them again and again <strong>(Nation, 2013; Webb, 2007)<\/strong>.<\/li>\n<\/ul>\n<blockquote>\n<p>Adding the citation is not extra. It is part of the sentence.<\/p>\n<\/blockquote>", "<h2>Quick review: Way 3 (point by point)<\/h2>\n<pre><code>Beginning   Interesting Beginning Sentence + Topic Sentence\nMiddle      1. Point 1 — about X and Y\n            2. Point 2 — about X and Y\n            3. Point 3 — about X and Y\nEnd         Concluding Sentence + Interesting Ending Sentence\n<\/code><\/pre>\n<p>✕ <em>A bicycle is cheap and slow. … A car is expensive and fast.<\/em> (Way 2)<\/p>\n<p>✓ <em>A bicycle is cheap, <\/em><em>while<\/em><em> a car is expensive. A bicycle is slow, <\/em><em>while<\/em><em> a car is fast.<\/em> (Way 3)<\/p>\n<p>Today, <strong>X and Y are two sources<\/strong>. At every point, both sources meet.<\/p>", "<h2>Two ways to learn new English words<\/h2>\n<ul>\n<li><strong>Source 1<\/strong> — Nation (2013): reading and listening<\/li>\n<li><strong>Source 2<\/strong> — Schmitt (2010): word lists and testing yourself<\/li>\n<\/ul>\n<p>Read both. Then fill in the chart together.<\/p>\n<p><button class=\"timer\" data-min=\"8\">⏱ Read &amp; chart · 8 min<\/button><\/p>", "<h2>Different or the same?<\/h2>\n<ul>\n<li>How are the two ways <strong>different<\/strong>?<\/li>\n<li>What do the two ways <strong>share<\/strong>?<\/li>\n<\/ul>\n<p><em>Look closely — do both need you to meet a word more than once?<\/em><\/p>", "<h2>Now bring in the graph<\/h2>\n<p><img src=\"images/aw-w06-figure-1-word-encounters.png\" alt=\"\"><\/p>", "<h2>What does Figure 1 show?<\/h2>\n<ol>\n<li>Say it in <strong>one sentence<\/strong>.<\/li>\n<li>Does it connect to Source 1, Source 2, or <strong>both<\/strong>? Why?<\/li>\n<\/ol>", "<h2>Write with citations<\/h2>\n<p>One paragraph · <strong>140–180 words<\/strong> · <strong>Way 3<\/strong><\/p>\n<ul>\n<li>Use both texts <strong>and<\/strong> Figure 1<\/li>\n<li>Cite each source in the sentence — including the figure<\/li>\n<li>One similarity and one difference<\/li>\n<li><strong>No opinion<\/strong> — this is comparison<\/li>\n<li>Reference list at the end<\/li>\n<\/ul>\n<p><button class=\"timer\" data-min=\"22\">⏱ Write · 22 min<\/button><\/p>", "<h2>Two mistakes to avoid<\/h2>\n<p>✕ <strong>The common writing style:<\/strong> \"Source 1 says… Source 2 says…\" — no contact between them<\/p>\n<p>✕ <strong>Uncited ideas:<\/strong> an idea from a source with no name and year<\/p>\n<p>✓ Point by point, with the citation inside the sentence<\/p>", "<h2>A model paragraph<\/h2>\n<p style=\"font-size:22px; text-align:left; line-height:1.4; margin:0 0 10px\"><strong>Two Roads to New Words<\/strong><br>How often must you meet a new word before you know it? Reading and listening, and studying word lists, are two different ways to learn vocabulary, but they share one important idea. First, they differ in how learners meet words. Nation (2013) describes reading books and watching videos that learners enjoy, while Schmitt (2010) explains a planned method with word lists, flashcards, and self-testing. Second, they differ in speed. Reading and listening is slow, because each meeting teaches only a little (Nation, 2013). In contrast, studying word lists is fast, because learners choose the words they need (Schmitt, 2010). However, both ways depend on meeting a word many times: readers see words again and again, and flashcard learners test themselves again after a few days and a week. Figure 1 supports this, showing that a word is remembered better the more often it is met (Webb, 2007). In short, the two ways look different, but both work through repetition. As the saying goes, practice makes perfect, and for new words, practice means meeting them often.<\/p>\n<p style=\"font-size:16px; text-align:left; line-height:1.35; padding-left:2em; text-indent:-2em; margin:0\"><strong>References<\/strong><br>Nation, I. S. P. (2013). <em>Learning vocabulary in another language<\/em> (2nd ed.). Cambridge University Press.<br>Schmitt, N. (2010). <em>Researching vocabulary: A vocabulary research manual<\/em>. Palgrave Macmillan.<br>Webb, S. (2007). The effects of repetition on vocabulary knowledge. <em>Applied Linguistics, 28<\/em>(1), 46–65.<\/p>", "<h2>Why it works<\/h2>\n<p style=\"font-size:22px; text-align:left; line-height:1.45; margin:0\"><strong>Two Roads to New Words<\/strong><br><span style=\"font-size:0.75em; font-weight:bold; color:#6a3d9a\">[Interesting Beginning Sentence]<\/span> How often must you meet a new word before you know it? <span style=\"font-size:0.75em; font-weight:bold; color:#6a3d9a\">[Topic Sentence]<\/span> Reading and listening, and studying word lists, are two different ways to learn vocabulary, but they share one important idea. <span style=\"font-size:0.75em; font-weight:bold; color:#b05a00\">[Point 1: how]<\/span> <u>First,<\/u> they differ in how learners meet words. <strong style=\"color:#2f5d8a\">Nation (2013)<\/strong> describes reading books and watching videos that learners enjoy, <u>while<\/u> <strong style=\"color:#2f5d8a\">Schmitt (2010)<\/strong> explains a planned method with word lists, flashcards, and self-testing. <span style=\"font-size:0.75em; font-weight:bold; color:#b05a00\">[Point 2: speed]<\/span> <u>Second,<\/u> they differ in speed. Reading and listening is slow, because each meeting teaches only a little <strong style=\"color:#2f5d8a\">(Nation, 2013)<\/strong>. <u>In contrast,<\/u> studying word lists is fast, because learners choose the words they need <strong style=\"color:#2f5d8a\">(Schmitt, 2010)<\/strong>. <span style=\"font-size:0.75em; font-weight:bold; color:#b05a00\">[Point 3: what they share]<\/span> <u>However,<\/u> both ways depend on meeting a word many times: readers see words again and again, and flashcard learners test themselves again after a few days and a week. <span style=\"font-size:0.75em; font-weight:bold; color:#1f7a4d\">[Figure 1]<\/span> Figure 1 supports this, showing that a word is remembered better the more often it is met <strong style=\"color:#2f5d8a\">(Webb, 2007)<\/strong>. <span style=\"font-size:0.75em; font-weight:bold; color:#6a3d9a\">[Concluding Sentence]<\/span> In short, the two ways look different, but both work through repetition. <span style=\"font-size:0.75em; font-weight:bold; color:#6a3d9a\">[Interesting Ending Sentence]<\/span> As the saying goes, practice makes perfect, and for new words, practice means meeting them often.<\/p>", "<h2>Check it against the moves<\/h2>\n<ul>\n<li>✓ The <strong>Unit 5 shape<\/strong>: interesting beginning, topic sentence, concluding sentence, interesting ending<\/li>\n<li>✓ Both texts <strong>and<\/strong> Figure 1<\/li>\n<li>✓ Every idea <strong>cited<\/strong>, with reporting verbs: <em>describes · explains · shows<\/em><\/li>\n<li>✓ <strong>Way 3<\/strong> all the way: both sources meet at every point<\/li>\n<li>✓ Two <strong>differences<\/strong> and one <strong>similarity<\/strong><\/li>\n<li>✓ Figure 1 supports the <strong>shared<\/strong> idea<\/li>\n<li>✓ <strong>No opinion<\/strong> — and a reference list in <strong>A–Z<\/strong> order<\/li>\n<\/ul>", "<h2>Homework<\/h2>\n<ul>\n<li>Finish the <strong>Activity 2<\/strong> paragraph: studying alone vs. with others — cited, with a reference list, typed, on <strong>LUNA<\/strong><\/li>\n<li>Next <strong>dictation<\/strong><\/li>\n<li>Read <strong>Unit 10<\/strong> (Cause &amp; Effect)<\/li>\n<\/ul>\n<p>Next week: cause and effect.<\/p>"]};</script>
